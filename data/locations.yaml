# TLUG meeting venues.
#
# Reference a venue from a meeting page with `location: <key>` in the
# frontmatter params. All fields except `name` are optional:
#
#   key:
#     name: Venue Name          # shown on cards and meeting pages
#     address:                  # one line per list item
#       - Building, Floor
#       - Street
#       - Ward, City Postal-code
#     apple: https://...        # Apple Maps link
#     google: https://...       # Google Maps link
#     venue: https://...        # venue's own website
#
# For a one-off venue, skip this file and put the address directly in the
# meeting's frontmatter (see README.md).

